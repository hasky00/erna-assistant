# Erna — Nginx reverse proxy for erna.aiassistent.site
# Install: sudo cp deploy/nginx-erna.conf /etc/nginx/sites-available/erna
# Enable:  sudo ln -sf /etc/nginx/sites-available/erna /etc/nginx/sites-enabled/erna
# Test:    sudo nginx -t && sudo systemctl reload nginx
# SSL:     sudo certbot --nginx -d erna.aiassistent.site

server {
    listen 80;
    listen [::]:80;
    server_name erna.aiassistent.site;

    client_max_body_size 10M;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
    }
}