name: Erna
options:
  bundleIdPrefix: site.aiassistent
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  Erna:
    type: application
    platform: iOS
    sources:
      - path: Erna
    configFiles:
      Debug: Config/Secrets.xcconfig
      Release: Config/Secrets.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: site.aiassistent.erna
        PRODUCT_NAME: Erna
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        # Simulator builds work without a signing team; set one in Xcode to run
        # on a device or to archive for TestFlight.
        CODE_SIGN_STYLE: Automatic
        CODE_SIGNING_ALLOWED: NO
    info:
      path: Erna/Info.plist
      properties:
        CFBundleDisplayName: Erna
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIUserInterfaceStyle: Dark
        ITSAppUsesNonExemptEncryption: false
        # Read by Config.swift. Values come from Config/Secrets.xcconfig.
        ERNA_API_BASE_URL: $(ERNA_API_BASE_URL)
        ERNA_SUPABASE_URL: $(ERNA_SUPABASE_URL)
        ERNA_SUPABASE_ANON_KEY: $(ERNA_SUPABASE_ANON_KEY)
        NSAppTransportSecurity:
          # Only relaxes http:// for localhost, so you can point the app at
          # `npm run dev` while testing. Production traffic stays HTTPS-only.
          NSAllowsLocalNetworking: true
